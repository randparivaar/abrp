name: Dispatch Daily Birthday & Anniversary Wishes

on:
  schedule:
    # 06:00 AM IST daily (UTC 00:30)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  dispatch-wishes:
    name: Trigger Automated Daily Wishes
    runs-on: ubuntu-latest
    steps:
      - name: Send Daily Wishes Request to ABRP Backend
        run: |
          echo "Triggering daily wishes cron on ABRP production API..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET \
            "https://api.abrp.walogics.in/v1/notifications/cron/daily-wishes" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Successfully dispatched daily wishes!"
          else
            echo "❌ Failed to dispatch daily wishes (HTTP $HTTP_STATUS)"
            exit 1
          fi

